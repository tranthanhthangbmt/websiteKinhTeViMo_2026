<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Bài giảng - Kinh tế vi mô</title>
    <meta name="description" content="Tổng hợp 15 video bài giảng môn Kinh tế vi mô.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Animated Background -->
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>
    <div class="bg-shape shape-3"></div>

    <div class="app-container">
        <!-- Main Menu View -->
        <main id="menu-view" class="view active">
            <header class="glass-header">
                <h1>Hệ thống Video Bài giảng</h1>
                <p>Môn Kinh tế vi mô - ThS. Nguyễn Đào Xuân</p>
            </header>
            
            <div class="grid-container" id="video-grid">
                <!-- Buttons will be generated by JavaScript -->
            </div>
        </main>

        <!-- Player View -->
        <section id="player-view" class="view">
            <div class="player-header">
                <button id="back-btn" class="glass-btn back-btn">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                    Quay lại
                </button>
                <h2 id="current-title" class="current-title">Buổi 1: Tổng quan</h2>
            </div>
            
            <div class="video-container glass-panel">
                <iframe id="main-iframe" src="" frameborder="0" allowfullscreen></iframe>
            </div>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
